  <section aria-labelledby="map-heading">
    <h2 class="plan-tab-title" id="map-heading">七个板块怎样连接</h2>
    <figure class="plan-map" aria-label="全站架构图，各节点可进入原型">
      <div class="map-band">
        <a class="map-node primary" href="#home"><strong>社区广场</strong><span class="fine">打开即读帖</span></a><span class="map-arrow" aria-hidden="true">→</span>
        <a class="map-node" href="#topics"><strong>主题与搜索</strong><span class="fine">按处境找内容</span></a><span class="map-arrow" aria-hidden="true">→</span>
        <a class="map-node primary" href="#post/desk"><strong>帖子与讨论</strong><span class="fine">评论、回复、续写</span></a>
      </div>
      <div class="map-band">
        <a class="map-node" href="#inbox"><strong>消息</strong><span class="fine">公开互动通知／同意后私聊</span></a><span class="map-arrow" aria-hidden="true">←</span>
        <a class="map-node purple" href="#me/posts"><strong>账号与我的</strong><span class="fine">身份、作品和记录</span></a><span class="map-arrow" aria-hidden="true">→</span>
        <a class="map-node" href="#write/new"><strong>发帖</strong><span class="fine">发布后回到原帖</span></a>
      </div>
      <div class="map-govern"><a class="map-node" href="#rules"><strong>社区治理</strong><span class="fine">规则 → 举报弹层 → 管理员队列 → 处置、恢复或反馈</span></a></div>
      <figcaption class="fine">登录弹层在需要互动时出现，登录后回到原操作。每条通知和收藏都回到原帖；评论回复、匿名和续写都在帖内完成。</figcaption>
    </figure>
  </section>
  <details class="panel build-notes"><summary>查看各板块的职责与入口</summary><div class="spec-grid" style="margin-top:.65rem">
    <article class="panel spec-card"><div class="actions spread"><h3>社区广场</h3><span class="tag">首版</span></div><p>让第一次来的人直接看到别人正在聊什么。</p><dl><dt>页面与功能</dt><dd>页头显示品牌和搜索。社区标题、排序之后直接是帖子列表，提供评论、共鸣和收藏。</dd><dt>入口与去向</dt><dd>Logo 或广场 → 读帖、换主题、搜索、发布；游客可读。</dd></dl><div class="actions"><a href="#home" class="btn">打开广场</a></div></article>
    <article class="panel spec-card"><div class="actions spread"><h3>主题与搜索</h3><span class="tag">首版简化</span></div><p>通过熟悉的处境找到能接上的对话。</p><dl><dt>页面与功能</dt><dd>七个主题入口，主题结果复用信息流。搜索有结果页，先匹配标题、正文、主题和续写文本。</dd><dt>入口与去向</dt><dd>桌面侧栏、手机主题页、标签或页头搜索 → 原帖；无结果可回全部。</dd></dl><div class="actions"><a href="#home/study/latest" class="btn">打开学业主题</a><a href="#search/%E9%9D%A2%E8%AF%95" class="quiet">看搜索结果</a></div></article>
    <article class="panel spec-card"><div class="actions spread"><h3>帖子与讨论</h3><span class="tag">首版 · 续写可后加</span></div><p>读完一段话，就在同一页接着聊。</p><dl><dt>页面与功能</dt><dd>独立详情。正文、共鸣、收藏、举报、两层评论；作者可追加后续，读者可从相关推荐继续。</dd><dt>入口与去向</dt><dd>信息流、收藏、通知 → 原帖或指定评论；回原列表或同主题。</dd></dl><div class="actions"><a href="#post/desk" class="btn">打开帖子</a><a href="#post/desk/c-d5" class="quiet">定位一条回复</a></div></article>
    <article class="panel spec-card"><div class="actions spread"><h3>发帖</h3><span class="tag">首版</span></div><p>从一句想说的话开始，心里没答案也能发。</p><dl><dt>页面与功能</dt><dd>独立编辑器，编辑、草稿和预览复用。必填主题、标题、正文，另选前台身份。</dd><dt>入口与去向</dt><dd>页头发布、移动底栏、主题空态 → 预览或直接发布到原帖；存草稿到「我的」。</dd></dl><div class="actions"><a href="#write/new" class="btn">打开编辑器</a></div></article>
    <article class="panel spec-card"><div class="actions spread"><h3>账号与我的</h3><span class="tag">首版</span></div><p>保留自己的内容和权限，匿名帖也能找回。</p><dl><dt>页面与功能</dt><dd>登录用弹层。我的页面用标签承载帖子、匿名帖、评论、收藏、草稿和设置。公开署名页可在后续开放。</dd><dt>入口与去向</dt><dd>页头头像、移动底栏、互动触发登录 → 回原操作或查看个人记录。</dd></dl><div class="actions"><a href="#me/posts" class="btn">打开个人中心</a><button type="button" class="quiet" data-action="open-login">体验登录</button></div></article>
    <article class="panel spec-card"><div class="actions spread"><h3>站内通知</h3><span class="tag">首版简化</span></div><p>让用户知道有人回应了自己，回去接着聊。</p><dl><dt>页面与功能</dt><dd>独立列表、角标、逐条已读、全部已读。首版接评论和回复，有续写后增加更新通知。</dd><dt>入口与去向</dt><dd>顶部或底栏通知 → 原帖／楼中楼；内容已移除则提示并保留返回。</dd></dl><div class="actions"><a href="#inbox" class="btn">打开通知</a></div></article>
    <article class="panel spec-card"><div class="actions spread"><h3>社区治理</h3><span class="tag">首版</span></div><p>让作者有退出权，让单人管理员能暂停新增风险。</p><dl><dt>页面与功能</dt><dd>公开规则页、举报弹层、权限隔离的单队列。隐藏、恢复、删除、限制账号、暂停发帖或回帖。</dd><dt>入口与去向</dt><dd>帖子或评论举报 → 留在原讨论；管理员处置后留在队列，可回看记录。</dd></dl><div class="actions"><a href="#rules" class="btn">查看规则</a><a href="#me/settings" class="quiet">从设置进入管理演示</a></div></article>
  </div></details>
  <div class="actions" style="margin-top:.9rem"><a class="btn primary" href="#about/pages">逐页体验 →</a><a href="#about/brand" class="btn">品牌备选</a></div>

    <article class="panel spec-card"><span class="tag">文本稳定后 · 图文</span><h3 style="margin-top:.35rem">先做有边界的附件</h3><p>每帖至多四张 JPEG、PNG 或 WebP，每张原文件不超过 5 MB。服务端验文件类型、大小和像素，受限上传到私有对象存储，经授权后才读取。统一转码去除 EXIF，生成列表缩略图和详情图，清理弃用及删帖附件。举报能定位单张图片，管理员能隐藏。设账号和全站存储预算、上传频率与过期清理，控制流量和成本。</p></article>

<template id="plan-content">
  <div class="content-shell"><section class="panel stack"><h2>失败学是什么</h2><p><strong>把评价放回它要解决的问题，把选择放回人的处境。</strong> 分数可以决定一次录取，指标可以检查一项工作。一个结论一旦被拿去衡量整个人，就该追问它测到了什么、遗漏了什么。落榜的失落和实际损失都值得承认；经历也可以停在原处，只讲发生过的事。</p>
  <p>成功学常从赢家的结果倒推一套做法，伤在看不见做同样选择却没得到同样结果的人。励志内容习惯用后来好起来解释当初的痛。树洞能让此刻的情绪有地方安放。这里让倾诉继续成立，也让愿意多谈一步的人补上当时可选什么、付了什么、哪些收获很难复制。反内卷、躺平、继续考、想涨薪，都可以进入讨论，同样要放在本人拥有的时间、钱、照护责任和制度门槛里看。</p>
  <p>有人来发一句「面试又挂了」，有人想知道这行到底卡哪张证，还有人拿复盘回来更正以前说的话。选题从经验、条件和证据出发。教育、AI、职业价值和人生意义都能聊，例如一次作业完成、过几天独立做和在新场景里应用，分别能说明什么。也欢迎拿出有效的考试设计、学历筛选的现实理由，或对 AI 的具体反例。</p></section>
  <section class="panel stack"><h2>旧建议，遇上新条件</h2><p>这是贯穿内容的一根线。学历是否仍有信息价值，和学历能否经由原来的入口换来同一种工作，是两个问题。比较代际经历时，具体到哪年、哪类岗位、谁来招、还要什么；比较 AI 前后的能力时，区分当场完成与日后独立完成。复盘再问自己当时还能做什么，哪些门槛超出个人掌控。</p><p>两个人的经历能帮人发现招聘入口、照护责任或工具变了。要推到一个行业或一代人，还需要口径一致的资料，也欢迎有人贴一个同期反例。两段机电岗位的求职经历可以在普通信息流和相关推荐里读到。</p><a href="#compare/past" class="btn">看跨年代的同题对照</a></section>
  <section class="panel stack"><h2>三条内容路线</h2>

  function postImages(post) {
    return pictures.get(post.id) || (post.id === 'steady' && post.imageCount === undefined && demoPicture.startsWith('data:image/') ? [demoPicture] : []);
  }
  const imageLabel = (post,index) => post.id === 'steady' && post.imageCount === undefined && index === 0
    ? '演示图片：小区里的羽毛球场' : '帖子图片 ' + (index+1);
  const thumb = (url,alt) => `<img src="${esc(url)}" alt="${esc(alt)}" loading="lazy" decoding="async">`;
  function photoTeaser(post) {
    const urls = postImages(post);
    return urls.length ? `<a class="feed-photo" href="#${postPath(post.id,'photos')}" aria-label="查看帖子配图">${thumb(urls[0],imageLabel(post,0))}</a>` : '';
  }
  function imageGallery(post) {
    const urls = postImages(post);
    if (!urls.length) return post.imageCount ? '<p class="fine">重新打开原型后，之前的临时配图已清除。</p>' : '';
    return `<div id="photos" class="image-grid${urls.length===1?' single':''} focus-anchor">${urls.map((url,index)=>
      `<button type="button" class="picture" data-action="view-photo" data-p="${esc(post.id)}" data-value="${index}" aria-label="放大第 ${index+1} 张图片">${thumb(url,imageLabel(post,index))}</button>`).join('')}</div>`;
  }
  function photoInput(model) {
    return `<section class="image-field">
      <div class="actions spread"><strong>配图 · ${model.images.length}/${imageLimit}</strong>
      ${model.images.length < imageLimit ? '<label class="btn">添加图片<input class="visually-hidden" name="images" type="file" multiple accept="image/jpeg,image/png,image/webp"></label>' : '<span class="fine">已达四张上限</span>'}</div>
      <p class="fine">JPEG、PNG、WebP，每张最多 5 MB。图片仅在本页临时保存，重新打开文件后清除。</p>
      ${model.imageError ? `<p class="hint alert" role="alert">${esc(model.imageError)}</p>` : ''}
      ${model.images.length ? `<div class="image-grid editor-images">${model.images.map((url,index)=>`<div>
      <button type="button" class="picture" data-action="preview-photo" data-value="${index}" aria-label="预览第 ${index+1} 张图片">${thumb(url,'已选图片 '+(index+1))}</button>
      <div class="actions">${action('move-photo','前移',{value:index,off:index===0})}${action('move-photo-back','后移',{value:index,off:index===model.images.length-1})}${action('remove-photo','移除',{value:index})}</div></div>`).join('')}</div>` : ''}</section>`;
  }
  async function imagePreview(file) {
    if (file.size > 5*1024*1024) throw new Error('有图片超过 5 MB。');
    if (!file.size) throw new Error('有文件为空。');

      <label class="form-item"><span>${esc(prompt)}</span><textarea name="body" maxlength="800" placeholder="说说你的感受，或接上对方的话。" required${paused?' disabled':''}>${esc(draft.body)}</textarea></label>
      ${!original&&!parent&&!paused?replyStarters(post):''}
      ${original || locked ? `<p class="fine">${original ? '编辑时保留原身份。' : '本帖继续以「' + esc(locked.name) + '」发言。'}</p>` : identities(draft.anon)}
      <div class="composer-line"><p class="fine">${paused ? '当前暂停互动，已有评论可读。' : '尊重当事人。请勿发送姓名、地址或联系方式。'}</p>
      <div class="actions"><button class="btn primary" type="submit"${paused?' disabled':''}>${original?'保存修改':parent?'发出回复':'发表评论'}</button>
      ${original || parent ? action('close-compose','取消',{p:post.id}) : ''}</div></div></form>`;
  }
  function commentBody(body) {
    const characters = Array.from(body);
    if (characters.length <= 200) return `<p class="narrative">${esc(body)}</p>`;
    return `<details class="comment-long"><summary><span class="when-closed">查看完整评论</span><span class="when-open">收起长评论</span><span class="summary-copy">${esc(characters.slice(0,128).join(''))}…</span></summary><p class="narrative">${esc(body)}</p></details>`;
  }
  function commentRow(p,c,target) {
    const targetComment = getComment(p,c.replyTo);
    const context = c.root && targetComment && targetComment.id !== c.root
      ? `<p class="reply-context">回复 ${esc(targetComment.status==='visible'?identity(p,targetComment).name:'已移除的评论')}</p>` : '';
    const highlighted = target === c.id ? ' focused' : '';
    if (c.status !== 'visible') {
      return `<article class="comment focus-anchor${highlighted}" id="${c.id}"><p class="fine gone">${c.status==='deleted' ? '这条评论已删除。' : '这条评论已由管理隐藏。'}</p></article>`;
    }
    const canManage = s.signed && c.author === me;
    const liked = s.signed && c.resonators.includes(me);
    return `<article class="comment focus-anchor${highlighted}" id="${esc(c.id)}"><div class="meta-row">${authorHtml(p,c)}
      <time class="fine">${displayTime(c.time)}</time>${c.edited ? tag('已编辑','neutral') : ''}</div>${context}
      ${editing?.p===p.id && editing.c===c.id ? commentForm(p,null,c) : commentBody(c.body)}
      <div class="actions">${action('reply','回复',{p:p.id,c:c.id})}${action('comment-like',liked?'已共鸣':'共鸣',{p:p.id,c:c.id,glyph:'dot',pressed:liked})}
      ${canManage ? action('edit-comment','编辑',{p:p.id,c:c.id}) + action('comment-delete-ask','删除',{p:p.id,c:c.id}) : action('report','举报',{p:p.id,c:c.id})}</div>
      ${replying?.p===p.id && replying.c===c.id ? commentForm(p,c) : ''}</article>`;
  }
  function discussion(p,target) {
    const timeOrder = commentSort === 'newest' ? (a,b)=>b.time-a.time : (a,b)=>a.time-b.time;
    const roots = p.comments.filter(c=>!c.root && (c.status==='visible' || p.comments.some(child=>child.root===c.id && child.status==='visible'))).sort(timeOrder);
    const targetComment = getComment(p,target);
    if (targetComment?.root) expanded.add(targetComment.root);
    return `<section class="panel discuss focus-anchor" id="discussion"><div class="actions spread"><h2>${visibleComments(p).length} 条评论</h2>
      <label class="actions fine">排序<select class="select" style="width:auto;min-height:36px" id="comment-order">
      <option value="oldest"${commentSort==='oldest'?' selected':''}>顺着读</option><option value="newest"${commentSort==='newest'?' selected':''}>最新在前</option></select></label></div>
      <hr class="rule">${commentForm(p)}
      <div class="comments">${roots.map(root => {
        const replies = p.comments.filter(c=>c.root===root.id && (c.status==='visible' || c.id===target)).sort((a,b)=>a.time-b.time);
        const isOpen = expanded.has(root.id);
        return `${commentRow(p,root,target)}${replies.length ? `<div class="nested">
        ${replies.slice(0,isOpen ? replies.length : 1).map(c=>commentRow(p,c,target)).join('')}
        ${replies.length>1?action('expand',isOpen?'收起部分回复':`展开全部 ${replies.length} 条回复`,{p:p.id,c:root.id,pressed:isOpen}):''}</div>`:''}`;
      }).join('') || '<p class="hint">还没有评论。可以留下第一句。</p>'}
      ${targetComment && targetComment.status !== 'visible' ? '<p class="fine">通知对应的评论已移除，仍可查看其他讨论。</p>' : ''}</div></section>`;
  }
  function relatedPosts(post) {
    const available = s.posts.filter(item => item.id !== post.id && allowedPost(item));
    const sameQuestion = known(compareTopics,post.question)?questionPosts(post.question,post.id):[];
    const sameTopic = sorted(available.filter(item => item.topic === post.topic),'latest');
    const items = (sameQuestion.length?sameQuestion:sameTopic.length ? sameTopic : sorted(available.filter(item => item.kind === post.kind),'recommended')).slice(0,2);
    if (!items.length) return '';
    return `<section class="panel related"><div class="actions spread"><h2>${sameQuestion.length?'同一道题的其他走法':sameTopic.length ? '同主题讨论' : '还可以读'}</h2>${sameQuestion.length?href('compare/'+post.question,'打开对照','quiet'):href(feedPath(post.topic),topics[post.topic][0],'quiet')}</div>
      ${items.map(item => postRow(item)).join('')}</section>`;
  }
  function detail(p,target) {
    if (!allowedPost(p)) return `${crumb(lastFeed)}${empty('这篇帖子暂时无法打开','原帖可能已删除或由管理隐藏。',href('home','去广场','btn primary')+href('me/posts','我的帖子'))}`;
    const owned = s.signed && p.author === me;
    const updates = p.updates.map(u=>`<section id="${u.id}" class="post-update focus-anchor"><div class="actions spread"><h2>后续更新</h2><time class="fine year-stamp">${displayFullDate(u.time)}</time></div><p class="narrative">${esc(u.body)}</p></section>`).join('');
    return `${crumb(lastFeed,lastFeed.startsWith('compare/')?'返回同题对照':'返回列表')}<article class="panel detail-head">
      ${postMeta(p,true)}
      <h1>${esc(p.title)}</h1><p class="narrative">${esc(p.body)}</p>${imageGallery(p)}${questionNote(p)}${updates}
      <div class="actions detail-actions">${postActions(p,true)}
      ${owned ? `${action('update','更新后续',{p:p.id,look:'btn lime'})}${href('edit/'+p.id,'编辑','quiet')}${action('post-delete-ask','删除',{p:p.id})}` : action('report','举报',{p:p.id})}</div>
      ${p.anon ? `<p class="fine">楼主在本帖内使用同一匿名身份。${p.anonChat&&p.author!==me?' 此帖开放匿名私聊请求。':''}</p>${p.anonChat&&p.author!==me?action('dm-request-anon','请求匿名私聊',{p:p.id,look:'btn'}):''}` : ''}</article>${discussion(p,target)}${relatedPosts(p)}`;
  }

  function modelFor(token,topic,editingPost = null) {
    const key = editingPost ? 'edit/'+editingPost.id : 'write/'+token;
    if (!editorModels.has(key)) {
      const source = editingPost || s.drafts.find(d=>d.id===token);
      editorModels.set(key,{title:source?.title||'', body:source?.body||'', topic:source?.topic || (known(topics,topic)?topic:''), kind:source?.kind||'story',anon:source?.anon||false,
        question:source?.question||'',condition:source?.condition||'',listen:source?.listen===true,
        anonChat:source?.anonChat===true,images:editingPost?[...postImages(editingPost)]:[...(pictures.get(token)||[])],imageError:!editingPost&&source?.imageCount&&!pictures.has(token)?'此前的临时配图已清除，可重新添加。':'',
        error:'',preview:false,display:source?.display || s.nickname});
    }
    return editorModels.get(key);
  }
  function write(token,topic,editingPost = null) {
    if (editingPost && (!s.signed || editingPost.author!==me || !allowedPost(editingPost))) {
      return `${crumb()}${empty('无法编辑这篇帖子','只有作者能编辑仍然可见的帖子。',href('me/posts','去个人中心'))}`;
    }
    if (!editingPost && token!=='new' && (!s.signed || !s.drafts.some(d=>d.id===token))) {
      return `${crumb()}${empty('找不到这份草稿','可以查看自己的草稿，或重新开始。',href('write/new','写一篇新帖','btn primary')+href('me/drafts','我的草稿'))}`;
    }
    const m = modelFor(token,topic,editingPost);
    const ownerName = m.anon ? '匿名楼主' : editingPost?.display || s.nickname;
    const preview = m.preview ? `<div class="preview-pane"><p class="fine strong">读者看到的预览</p><div class="meta-row">${avatar(ownerName,m.anon)}<strong>${esc(ownerName)}</strong>${tag(topics[m.topic][0])}${tag(kinds[m.kind],'neutral')}</div>
      <h2>${esc(m.title)}</h2><p class="narrative">${esc(m.body)}</p>${questionNote(m)}${m.listen?'<p class="fine">这帖先听听</p>':''}
      ${m.images.length?`<div class="image-grid${m.images.length===1?' single':''}">${m.images.map((url,index)=>thumb(url,'配图 '+(index+1))).join('')}</div>`:''}</div>` : '';
    return `${crumb(editingPost?postPath(editingPost.id):lastFeed,editingPost?'返回原帖':'返回浏览')}${title(editingPost?'编辑帖子':'发布帖子','可以写一段经历，也可以问一个问题。')}
      <form class="panel post-form stack${editingPost?.anon?' editing-anon':''}" id="post-editor" data-form="post-editor" data-p="${editingPost?.id || ''}" data-value="${esc(token)}" novalidate>
      ${preview}<div class="form-pair">
      ${selection('topic','主题',{'':'请选择主题',...Object.fromEntries(Object.entries(topics).map(([k,[name]])=>[k,name]))},m.topic)}
      ${selection('kind','内容类型',kinds,m.kind)}</div>
      <label class="form-item"><span>标题</span><input name="title" maxlength="68" placeholder="给这段话一个简短标题" value="${esc(m.title)}"></label>
      <label class="form-item"><span>正文</span><textarea name="body" maxlength="4000" placeholder="从你最想说的那一句开始。">${esc(m.body)}</textarea></label>
      <details class="content-extra"${m.question||m.listen?' open':''}><summary>可选 · 同题对照与回应偏好</summary>
      ${selection('question','加入同题对照',{'':'普通帖子',...Object.fromEntries(Object.entries(compareTopics).map(([k,v])=>[k,v.title]))},m.question)}
      <label class="form-item"><span>当时的条件（可留空）</span><input name="condition" maxlength="90" value="${esc(m.condition)}" placeholder="例如，需要先有收入；两天后换题再试"></label>
      <label class="private-choice"><input name="listen" type="checkbox" value="yes"${m.listen?' checked':''}>这帖先听听。给建议前请先问我。</label></details>
      ${photoInput(m)}
      ${editingPost ? `<p class="fine">保留发布时的身份「${esc(ownerName)}」，避免通过编辑意外暴露账号。</p>` : identities(m.anon,true)}
      <label class="private-choice anon-choice"><input type="checkbox" name="anonChat" value="yes"${m.anonChat?' checked':''}>仅此帖允许匿名私聊请求，双方都用帖内身份。</label>
      <p class="hint">请去掉能识别本人或他人的个人信息。发布公开可读，匿名只隐藏前台身份。</p>
      ${s.pausePost&&!editingPost ? '<p class="hint alert">发帖暂时关闭，可以保存草稿。</p>' : ''}${m.error?`<p class="hint alert" role="alert">${esc(m.error)}</p>`:''}
      <div class="actions">${editingPost?'':action('save-draft','存为草稿',{look:'btn'})}${action('preview',m.preview?'重新预览':'发布前预览',{look:'btn'})}
      <button type="submit" class="btn primary">${editingPost?'保存修改':'发布帖子'}</button>${m.preview?action('close-preview','关闭预览'):''}</div></form>`;
  }

  function requireScreen(name,description) {
    return `${title(name,description)}${empty('登录后可以查看','用演示身份进入，不填写个人资料。',action('open-login','使用演示账号',{look:'btn primary'})+href('home','返回广场'))}`;
  }
  function postRow(p,extras = '',suffix='') {
    const subject = esc(p.title);
    return `<div class="row"><div class="row-copy"><div class="actions">${tag(topics[p.topic][0])}${p.hidden?tag('暂不可见','warn'):''}${suffix}</div>
      <h3>${p.hidden?subject:`<a href="#${postPath(p.id)}">${subject}</a>`}</h3><p class="fine">${displayTime(p.time)} · ${visibleComments(p).length} 条评论</p></div>${extras?`<div class="actions">${extras}</div>`:''}</div>`;
  }
  function profile(tab) {
    if (!s.signed) return requireScreen('我的','管理帖子、评论、收藏和草稿。');
    const section = known(tabs,tab)?tab:'posts';
    const mine = sorted(s.posts.filter(p=>p.author===me),'latest');
    const links = Object.entries(tabs).map(([k,name])=>`<a href="#me/${k}" class="pill"${k===section?' aria-current="page"':''}>${name}</a>`).join('');
    let content = '';
    if (section==='posts' || section==='anon') content = mine.filter(p=>section==='posts'||p.anon).map(p=>postRow(p,'',p.anon?tag('匿名发布','purple'):'')).join('');
    if (section==='comments') content = mineAndOtherComments();
    if (section==='saved') content = s.saved.slice().reverse().map(pid=>{
      const p = getPost(pid);
      const b = action('unsave','移除',{p:pid});
      return allowedPost(p)?postRow(p,b,s.follow.includes(pid)?tag('关注后续','purple'):''):`<div class="row"><p>原帖暂不可见</p>${b}</div>`;
    }).join('');
    if (section==='drafts') content = s.drafts.slice().reverse().map(d=>`<div class="row"><div class="row-copy"><h3><a href="#write/${d.id}">${esc(d.title || '未命名草稿')}</a></h3><p class="fine">仅在你的个人中心显示</p></div><div class="actions">${href('write/'+d.id,'继续编辑','quiet')}${action('draft-delete-ask','删除',{p:d.id})}</div></div>`).join('');
    if (section==='settings') {
      content = `<div class="stack"><form data-form="nickname"><label class="form-item"><span>演示昵称</span><input name="nickname" maxlength="16" required value="${esc(s.nickname)}"><span class="fine">新帖和新评论会使用新昵称。既有署名保持原样。</span></label><button class="btn primary" type="submit">保存昵称</button></form>
        <hr class="rule"><h3>私聊权限</h3><p class="fine">关闭后，署名资料页停止接收新请求，已有会话可继续查看。匿名权限在对应帖子里单独设置。</p>
        <div class="actions">${action('dm-preference',s.dmReceive?'接收请求：已开启':'接收请求：已关闭',{look:'btn',pressed:s.dmReceive})}${s.dmReceive?action('dm-incoming','模拟收到一个新请求',{look:'quiet'}):''}${action('dm-unread-demo','模拟未读私聊',{look:'quiet'})}</div>
        <hr class="rule"><h3>演示设置</h3><p class="fine">${storageOk?'模拟文字和会话保存在当前浏览器。自行添加的配图只保留在当前页面会话。':'当前浏览器限制本地存储，模拟记录只保留到页面关闭。'}</p>
        <div class="actions">${action('operator','打开管理演示',{look:'btn'})}${action('sim-reply','模拟别人回复我',{look:'btn'})}${action('sim-update','模拟关注帖更新',{look:'btn'})}${action('sim-write-fail',failNextWrite?'取消下次写入失败':'模拟下次写入失败',{look:'btn',pressed:failNextWrite})}${action('reset-ask','重置演示',{look:'btn danger'})}</div>
        <div class="actions">${action('logout','退出演示账号',{look:'btn'})}</div></div>`;
    }
    return `<header class="profile-title">${avatar(s.nickname)}${title(s.nickname,'我的社区记录 · 仅本人可见')}</header>
      <nav class="tabstrip" aria-label="个人中心">${links}</nav>
      ${content ? `<section class="panel">${content}</section>` : empty(section==='saved'?'还没有收藏':section==='drafts'?'还没有草稿':'这里暂时没有记录','浏览一个话题，或者写一段话。',href('home','去广场')+href('write/new','发帖','btn primary'))}`;
  }
  function mineAndOtherComments() {
    return s.posts.flatMap(p=>p.comments.filter(c=>c.author===me && c.status==='visible' && allowedPost(p)).map(c=>[p,c]))
      .sort(([,a],[,b])=>b.time-a.time).map(([p,c])=>`<div class="row"><div class="row-copy"><div class="actions">${c.anon?tag('匿名评论','purple'):''}<time class="fine">${displayTime(c.time)}</time></div>
      <h3><a href="#${postPath(p.id,c.id)}">${esc(short(c.body,78))}</a></h3><p class="fine">在《${esc(p.title)}》下</p></div></div>`).join('');
  }
  function publicProfile(who) {
    const posts = sorted(s.posts.filter(p=>allowedPost(p) && p.author===who && !p.anon),'latest');
    if (!known(people,who)) return `${crumb()}${empty('没有找到该主页','可以回广场查看其他帖子。',href('home','回广场'))}`;
    const name = who === me ? s.nickname : people[who];
    const messenger=who===me ? (s.signed?href('me/settings','私聊权限','btn'):'')
      : dmOpen.has(who)&&!s.limited.includes(who)?action('dm-request','发起私聊',{p:who,look:'btn primary'}):'<p class="fine">暂未开放私聊请求</p>';
    return `${crumb(lastFeed)}<div class="actions spread"><header class="profile-title">${avatar(name)}${title(name,'公开主页 · 仅显示公开署名帖子')}</header>${messenger}</div>
      ${posts.length?feedList(posts):empty('暂无公开署名帖子','这里显示用户用昵称发布的公开内容。',href('home','回广场'))}`;
  }
  function inbox() {
    if (!s.signed) return inboxTabs('notices')+requireScreen('消息','查看帖子评论、回复和关注帖更新。');
    return `<div class="actions spread">${title('消息','公开互动与私聊分开显示。')}${action('read-all','互动通知全部已读',{look:'btn',off:!unread()})}</div>${inboxTabs('notices')}
      ${s.notices.length?`<section class="panel">${[...s.notices].sort((a,b)=>b.time-a.time).map(n=>{
        const p = getPost(n.post);
        return `<a class="notification${n.read?'':' unread'}" href="#${postPath(n.post,n.target)}" data-notice="${n.id}">
        <span class="indicator${n.read?' read':''}" aria-hidden="true"></span><div><h3>${!n.read?'<span class="visually-hidden">未读 </span>':''}${esc(n.text)}</h3><p class="fine">${p&&allowedPost(p)?esc(p.title):'原内容暂不可见'} · ${displayTime(n.time)}</p></div></a>`;
      }).join('')}</section>`:empty('暂时没有通知','新回复或关注帖更新会出现在这里。',href('home','去广场'))}`;
  }
  function moderation() {
    if (!s.operator || !s.signed) return `${title('管理队列','')} ${empty('这个页面需要管理员身份','在个人中心设置中可以切换到管理演示。',href('me/settings','打开设置')+href('home','返回广场'))}`;
    const open = s.reports.filter(r=>!r.done).length;
    const cases = s.reports.filter(r=>adminFilter==='all'||!r.done);
    return `${title('社区管理','演示管理员 · 举报与开关集中在此页。')}<div class="stack">
      <div class="stats"><div><strong>${s.posts.filter(allowedPost).length}</strong>可见帖子</div><div><strong>${open}</strong>待处理举报</div><div><strong>${s.limited.length}</strong>受限账号</div></div>
      <section class="panel stack"><h2>发帖与评论</h2><div class="actions">${action('pause-post',s.pausePost?'恢复发帖':'暂停新发帖',{look:'btn',pressed:s.pausePost})}
      ${action('pause-comment',s.pauseComment?'恢复评论':'暂停新评论',{look:'btn',pressed:s.pauseComment})}
      ${action('exit-operator','退出管理演示',{look:'quiet'})}</div></section>
      <section class="panel stack"><div class="actions spread"><h2>举报队列</h2><div class="actions">${action('admin-filter','待处理',{look:'pill',value:'open',pressed:adminFilter==='open'})}
      ${action('admin-filter','全部记录',{look:'pill',value:'all',pressed:adminFilter==='all'})}</div></div>
      <div class="list-admin">${cases.map(report=>{
        const p = getPost(report.post);
        const c = getComment(p,report.comment);
        const actor = report.comment ? c?.author : p?.author;
        const removable = p && (!report.comment || c);
        const hidden = report.comment ? c?.status==='hidden' : p?.hidden;
        const deleted = !removable || c?.status==='deleted';
        return `<article class="panel"><div class="actions">${tag(report.done?'已处理':'待处理',report.done?'neutral':'gold')}${tag(report.comment?'评论':'帖子')}</div>
          <h3>${esc(p?.title || '帖子已删除')}</h3><p class="fine">原因 · ${esc(reasons[report.reason])}</p>
          <p class="narrative">${deleted?'内容已删除。':esc(short(c?.body || p.body,150))}</p>
          <div class="actions">${!deleted ? action('moderate-hide',hidden?'恢复可见':'隐藏内容',{p:report.post,c:report.comment,value:report.id})+action('moderate-delete-ask','删除违规内容',{p:report.post,c:report.comment,value:report.id}) : ''}

    if (key==='comment' || key==='comment-edit') return submitComment(form,key==='comment-edit');
    const d=new FormData(form);
    if (key==='dm-send' || key==='dm-report') return submitChat(key,pid,d);
    if (key==='search') {
      const q=String(d.get('query')||'').trim();
      return go(q?'search/'+encodeURIComponent(q):'search');
    }
    if (key==='report') {
      const p=getPost(pid), c=getComment(p,cid);
      const reason=String(d.get('reason')||'');
      if (!s.signed || !allowedPost(p) || cid && c?.status!=='visible' || !known(reasons,reason)) return blocked();
      if (!s.reports.some(r=>r.post===pid && r.comment===cid && !r.done)) s.reports.push({id:id('r-'),post:pid,comment:cid,reason,done:false});
      persist(); closeDialog(); return redraw('举报已进入管理队列。');
    }
    if (key==='update') {
      const p=getPost(pid), body=String(d.get('body')||'').trim();
      if (!s.signed || p?.author!==me || !allowedPost(p) || s.pausePost || !writable()) return blocked();
      if (!body || body.length>2400) return notify('请写一段 2400 字以内的更新。');
      const writeError = takeWriteError();
      if (writeError) return notify(writeError);
      const u={id:id('u-'),time:timeNow(),body};
      p.updates.push(u); memory.delete('update/'+pid);
      persist(); closeDialog(); go(postPath(p.id,u.id)); return notify('后续已加到原帖。');
    }
    if (key==='nickname') {
      if (!s.signed) return blocked();
      const nickname=String(d.get('nickname')||'').trim();
      if (!nickname || nickname.length>16) return notify('请输入 1–16 个字符的演示昵称。');
      s.nickname=nickname; persist(); redraw('已保存演示昵称。');
    }
  }
  function render(_,navigate=false) {
    const [page,param,arg,hint] = route();
    const t = known(topics,param)?param:'all';
    const q = page==='search'?param||'':'';
    const listing = ['home','search','compare'].includes(page);
    const currentFeed = page==='compare'?'compare/'+(known(compareTopics,param)?param:'past')
      : page==='search'?(q?'search/'+encodeURIComponent(q):'search'):feedPath(t,known(allSorts,arg)?arg:'recommended');
    const restoreFeed = navigate && listing && previousPage === 'post' && currentFeed === lastFeed;
    if (navigate && page === 'post' && ['home','search','compare'].includes(previousPage)) feedScroll = window.scrollY || 0;
    if (navigate && page === 'write' && param === 'new' && hint === 'anon') {
      const draft = modelFor('new',arg);
      draft.anon = true;
      draft.preview = false;
    }
    if (navigate && page==='write' && param==='new' && known(compareTopics,hint)) {
      const draft=modelFor('new',arg);
      if (draft.question!==hint && !draft.condition) {
        draft.question=hint;
        draft.preview=false;
      }
    }
    if (page==='inbox' && param==='chat' && s.signed) {
      const thread=getChat(arg);
      if (thread?.unread) {thread.unread=false;persist();}
    }
    layoutShell(page,t,q);
    const views={home:()=>feed(t,arg),topics:allTopics,search:()=>search(q),compare:()=>compareScreen(param),post:()=>detail(getPost(param),arg),
      write:()=>write(param||'new',arg),edit:()=>write('editing','',getPost(param)),me:()=>profile(param),
      user:()=>publicProfile(param),inbox:()=>param==='chat'?chatScreen(arg):inbox(),admin:moderation,rules:rulesPage,about:()=>about(param)};
    if (listing) lastFeed = currentFeed;
    const hasRail=['topics','post','search'].includes(page);
    ui.layout.classList.toggle('no-right',!hasRail);
    ui.layout.classList.toggle('reading-layout',['home','post','search','compare'].includes(page));
    ui.main.classList.toggle('feed-main',page==='home');
    ui.main.classList.toggle('blueprint-main',page==='about');
    ui.main.classList.toggle('chat-main',page==='inbox' && param==='chat');
    ui.rail.innerHTML=hasRail?rightRail():'';
    ui.main.innerHTML=known(views,page)?views[page]():`${crumb()}${empty('找不到这个页面','从广场继续浏览。',href('home','回广场'))}`;
    const names={home:topicTitle(t),topics:'主题',search:'搜索',compare:'同题对照',post:allowedPost(getPost(param))?getPost(param).title:'帖子暂不可读',write:'发帖',edit:'编辑帖子',me:'我的',inbox:'消息',user:'公开主页',admin:'管理',rules:'社区约定',about:'设计蓝图'};
    document.title='另有解 · ' + (known(names,page)?names[page]:'社区');
    const log=ui.main.querySelector('.chat-log');
    if (log) log.scrollTop=log.scrollHeight;
    if (navigate) {
      previousPage = page;
      ui.main.focus({preventScroll:true});
      if (page==='post' && arg && allowedPost(getPost(param))) {
        const target=$(arg) || $('discussion');
        target?.scrollIntoView({block:'start'});
      } else window.scrollTo(0,restoreFeed?feedScroll:0);
    }
  }
  document.addEventListener('click',event=>{
    if (event.target.closest('.skip')) { event.preventDefault(); return ui.main.focus(); }
    const notice=event.target.closest('[data-notice]');
    if (notice && s.signed) {
      const match=s.notices.find(n=>n.id===notice.dataset.notice);
      if (match) { match.read=true; persist(); }
    }
    const control=event.target.closest('button[data-action]');
    if (control && !control.disabled) return handleAction(control);
    const anchor=event.target.closest('a[href^="#"]');
    if (anchor?.getAttribute('href')===location.hash) {
      event.preventDefault(); render(null,true);
    }
  });
  document.addEventListener('submit',submit);
  document.addEventListener('input',event=>{
    const form=event.target.closest('form[data-form]');
    if (!form) return;
    if (form.dataset.form==='update') memory.set('update/'+form.dataset.p,String(new FormData(form).get('body')||''));
    else if (form.dataset.form==='dm-send') memory.set('dm-draft/'+form.dataset.p,String(new FormData(form).get('body')||''));
    else track(form);
  });
  document.addEventListener('change',event=>{
    if (event.target.id==='comment-order') { commentSort=event.target.value; return redraw(); }
    const form=event.target.closest('form[data-form]');
    if (event.target.name==='images' && form?.dataset.form==='post-editor') return choosePhotos(event.target,form);
    if (form) track(form);
  });
  ui.dialog.addEventListener('cancel',()=>{afterAuth=null;viewer=null;ui.dialog.classList.remove('lightbox');});
  ui.dialog.addEventListener('keydown',event=>{
    if (!viewer || !['ArrowLeft','ArrowRight'].includes(event.key)) return;
    event.preventDefault();
    photoAction(event.key==='ArrowLeft'?'photo-prev':'photo-next');
  });
  window.addEventListener('hashchange',()=>{
    afterAuth=null;
    closeDialog();
    replying=null;
    editing=null;
    render(null,true);
  });
  render(null,true);
})();
</script>
</body>
</html>
